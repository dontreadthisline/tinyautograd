<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketchbook — 手绘原语画廊</title>
<style>
:root { --accent: #3a4aa8; --dim: #6b7280; --border: rgba(58,74,168,.16); --panel: #edf0f8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"PingFang SC",sans-serif; color: #1f2937; background: #fff; line-height: 1.8; }
.wrap { max-width: 980px; margin: 0 auto; padding: 40px 28px 60px; }
h1 { font: 500 40px Caveat,"Xingkai SC","Kaiti SC",KaiTi,cursive; color: var(--accent); margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 14.5px; margin-bottom: 40px; }
.ex { margin: 34px 0; }
.ex h2 { font: 500 26px Caveat,"Xingkai SC","Kaiti SC",KaiTi,cursive; }
.ex p { font-size: 13.5px; color: var(--dim); margin: 2px 0 12px; }
.frame { border: 1px solid var(--border); border-radius: 12px; background:
  radial-gradient(circle at 1px 1px, #efede7 1px, transparent 0) 0 0/26px 26px; padding: 20px 10px; }
.frame svg { display: block; margin: 0 auto; max-width: 100%; }
code { font: 12px ui-monospace,Menlo,monospace; color: var(--accent); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
<h1>sketchbook</h1>
<div class="sub">手绘原语的组合画廊 —— 每幅图由 <code>path / node / label / dot / flow</code> 五个原语构成</div>

<div class="ex">
<h2>1. 信号流 · 一体两面</h2>
<p>前向琥珀向右, 反向靛蓝向左 —— hero 同款</p>
<div class="frame"><svg id="ex1" viewBox="0 0 560 90" width="560" height="90"></svg></div>
</div>

<div class="ex">
<h2>2. 梯度下降 · 山谷</h2>
<p>loss 曲线手绘, 光点循环滚落</p>
<div class="frame"><svg id="ex2" viewBox="0 0 560 130" width="560" height="130"></svg></div>
</div>

<div class="ex">
<h2>3. 链式法则 · 接力</h2>
<p>余切沿逆拓扑序逐拍转交, 每拍算出的新余切交给前一层</p>
<div class="frame"><svg id="ex3" viewBox="0 0 560 110" width="560" height="110"></svg></div>
</div>

</div>
<script src="book/resources/js/sketch.js"></script>
<script>
/* 例 1: 信号流 */
(function () {
  const s = Sketch(document.getElementById('ex1'));
  const dl = 'M20 55 C 120 12, 220 85, 330 40', dr = 'M230 55 C 330 12, 430 85, 540 40';
  s.path('M20 55 C 120 12, 220 85, 330 40', { stroke: 'rgba(58,74,168,.35)' });
  s.path('M230 55 C 330 12, 430 85, 540 40', { stroke: 'rgba(58,74,168,.35)' });
  s.node(20, 55); s.node(330, 40); s.node(230, 55); s.node(540, 40);
  s.flow(dl, { color: s.PALETTE.amber });
  s.flow(dr, { color: s.PALETTE.ink, delay: 0.4 });
  s.label(175, 82, 'forward', { size: 20, color: '#bf8700' });
  s.label(385, 82, 'backward', { size: 20 });
})();

/* 例 2: 梯度下降山谷 */
(function () {
  const s = Sketch(document.getElementById('ex2'));
  const valley = 'M15 25 C 110 115, 190 118, 250 92 C 300 72, 330 108, 420 112 C 470 114, 520 60, 545 30';
  s.path(valley, { stroke: 'rgba(58,74,168,.55)', width: 2 });
  s.label(90, 40, 'loss', { size: 22, color: '#3a4aa8' });
  s.label(470, 40, 'steps →', { size: 18 });
  s.flow(valley, { color: s.PALETTE.amber, dur: 4.5, size: 5 });
  s.dot(545, 30, s.PALETTE.green, 6);
  s.label(516, 16, 'min', { size: 18, color: '#1a7f37' });
})();

/* 例 3: 链式法则接力 */
(function () {
  const s = Sketch(document.getElementById('ex3'));
  const xs = [80, 240, 400, 520];
  ['L', 'o', 'h', 'x'].forEach((n, i) => {
    s.node(xs[i], 45, { r: 17 });
    s.label(xs[i], 52, n, { size: 24, color: '#2c3a8c' });
  });
  for (let i = 0; i < 3; i++) {
    const d = `M${xs[i] + 20} 45 C ${xs[i] + 60} 45, ${xs[i+1] - 60} 45, ${xs[i+1] - 24} 45`;
    s.path(d, { stroke: 'rgba(58,74,168,.35)', arrow: true });
    s.flow(d, { color: s.PALETTE.green, dur: 2.4, delay: i * 0.8 });
  }
  s.label(80, 90, 'VJP', { size: 18, color: '#1a7f37' });
  s.label(240, 90, 'VJP', { size: 18, color: '#1a7f37' });
  s.label(400, 90, 'VJP', { size: 18, color: '#1a7f37' });
  s.label(300, 18, '余切沿逆拓扑序转交', { size: 19, color: '#6b7280' });
})();
</script>
</body>
</html>
