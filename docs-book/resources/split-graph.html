<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>多输出: 前向扇出与反向拼接</title>
<link rel="stylesheet" href="libs/katex/katex.min.css">
<script src="libs/katex/katex.min.js"></script>
<script src="js/sketch.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .tx { display: inline-block; line-height: 1.1; white-space: nowrap; width: max-content; }
  .bar { display: flex; gap: .5em; margin-bottom: .6em; justify-content: center; }
  .bar button { font: 500 .85em -apple-system,"PingFang SC",sans-serif; padding: .32em 1em;
    border: 1px solid #ddd8ce; border-radius: 6px; background: #fff; color: #24292f; cursor: pointer; }
  .bar button:hover { border-color: #0969da; color: #0969da; }
</style>
</head>
<body>
<div class="bar">
  <button onclick="spForward()">前向 (一入多出)</button>
  <button onclick="spBackward()">反向 (余切拼接)</button>
  <button onclick="spReset()">复位</button>
</div>
<svg id="sp" viewBox="0 0 660 340" width="660" height="340" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
window.addEventListener('load', function () {
  if (typeof Sketch === 'undefined') return;
  const svg = document.getElementById('sp');
  const s = Sketch(svg);
  const P = s.PALETTE;
  const NS = 'http://www.w3.org/2000/svg';

  const labels = [];
  function tex(x, y, latex, { color = '#2c3a8c', fs = 13, anchor = 'middle', weight = 500, cls = '' } = {}) {
    const fo = document.createElementNS(NS, 'foreignObject');
    if (cls) fo.setAttribute('class', cls);
    const div = document.createElement('div');
    div.className = 'tx';
    div.style.cssText = `color:${color};font-size:${fs}px;font-weight:${weight}`;
    katex.render(latex, div, { throwOnError: false });
    fo.appendChild(div); svg.appendChild(fo);
    const item = { fo, div, x, y, anchor };
    labels.push(item); place(item);
  }
  function place({ fo, div, x, y, anchor }) {
    const w = div.getBoundingClientRect().width, h = div.getBoundingClientRect().height;
    fo.setAttribute('width', Math.ceil(w) + 2); fo.setAttribute('height', Math.ceil(h) + 2);
    fo.setAttribute('x', anchor === 'middle' ? x - (w + 2) / 2 : x);
    fo.setAttribute('y', y - h / 2);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => labels.forEach(place));

  /* 图: v --split--> (a, b), a --> L;  b 无下游。多输出共享同一个 op, index 区分。 */
  const V = [75, 170], S = [235, 170], A = [410, 92], B = [410, 248], L = [565, 92];
  const RL = 15, R = 22;
  const eVS = s.path('M90 170 L 212 170', { stroke: 'rgba(58,74,168,.35)', width: 1.4, arrow: true });
  const eSA = s.path('M255 160 C 320 118, 350 100, 393 95', { stroke: 'rgba(58,74,168,.35)', width: 1.4, arrow: true });
  const eSB = s.path('M255 180 C 320 222, 350 240, 393 245', { stroke: 'rgba(58,74,168,.35)', width: 1.4, arrow: true });
  const eAL = s.path('M425 92 L 549 92', { stroke: 'rgba(58,74,168,.35)', width: 1.4, arrow: true });
  const nV = s.node(V[0], V[1], { r: RL, fill: '#dfe7fb' });
  const nS = s.node(S[0], S[1], { r: R });
  const nA = s.node(A[0], A[1], { r: RL });
  const nB = s.node(B[0], B[1], { r: RL });
  const nL = s.node(L[0], L[1], { r: RL, fill: '#dfe7fb' });
  s.label(V[0], V[1] + 4, 'v', { mono: true, size: 12, weight: 600, color: '#3a4aa8' });
  s.label(S[0], S[1] + 4, 'split', { mono: true, size: 11, weight: 600, color: '#2c3a8c' });
  s.label(A[0], A[1] + 4, 'a', { mono: true, size: 12, weight: 600, color: '#3a4aa8' });
  s.label(B[0], B[1] + 4, 'b', { mono: true, size: 12, weight: 600, color: '#3a4aa8' });
  s.label(L[0], L[1] + 4, 'L', { mono: true, size: 12, weight: 600, color: '#3a4aa8' });
  /* index 小标: 共享 op 的位次 */
  s.label(A[0] + 24, A[1] - 22, '0', { mono: true, size: 9, color: '#8a8f9c' });
  s.label(B[0] + 24, B[1] - 22, '1', { mono: true, size: 9, color: '#8a8f9c' });
  tex(L[0], L[1] - 40, 'L = \\operatorname{sum}(a)', { fs: 13 });

  const AMBER = '#bf8700', GREEN = '#1a7f37', INK = '#3a4aa8';
  const all = { v: nV, s: nS, a: nA, b: nB, L: nL };
  const edgeList = [eVS, eSA, eSB, eAL];
  let timers = [];
  const clr = () => { timers.forEach(clearTimeout); timers = []; };
  function base() {
    Object.entries(all).forEach(([id, n]) => {
      n.setAttribute('stroke', INK); n.setAttribute('stroke-width', 1.6);
      n.setAttribute('fill', (id === 'v' || id === 'L') ? '#dfe7fb' : '#fff');
    });
    edgeList.forEach(e => { e.setAttribute('stroke', 'rgba(58,74,168,.35)'); e.setAttribute('stroke-width', 1.4); });
    document.querySelectorAll('.dv-mark').forEach(g => g.remove());
  }
  window.spReset = base;

  window.spForward = function () {
    base();
    const T = (fn, i) => timers.push(setTimeout(fn, i * 460));
    T(() => { nV.setAttribute('stroke', AMBER); nV.setAttribute('stroke-width', 2.6); }, 0);
    T(() => { eVS.setAttribute('stroke', AMBER); eVS.setAttribute('stroke-width', 2.2); nS.setAttribute('stroke', AMBER); nS.setAttribute('stroke-width', 2.6); }, 1);
    T(() => { eSA.setAttribute('stroke', AMBER); eSA.setAttribute('stroke-width', 2.2); eSB.setAttribute('stroke', AMBER); eSB.setAttribute('stroke-width', 2.2); nA.setAttribute('stroke', AMBER); nA.setAttribute('stroke-width', 2.4); nB.setAttribute('stroke', AMBER); nB.setAttribute('stroke-width', 2.4); }, 2);
    T(() => { eAL.setAttribute('stroke', AMBER); eAL.setAttribute('stroke-width', 2.2); nL.setAttribute('stroke', AMBER); nL.setAttribute('stroke-width', 2.6); }, 3);
  };

  window.spBackward = function () {
    base();
    const T = (fn, i) => timers.push(setTimeout(fn, i * 560));
    /* 1. 余切从 L 回到 a; b 无下游, 余切缺席 */
    T(() => {
      nL.setAttribute('stroke', GREEN); nL.setAttribute('stroke-width', 2.5);
      eAL.setAttribute('stroke', GREEN); eAL.setAttribute('stroke-width', 2.2);
      nA.setAttribute('stroke', GREEN); nA.setAttribute('stroke-width', 2.5);
      tex(A[0], A[1] - 40, '\\bar{a}', { color: GREEN, fs: 14, weight: 600, cls: 'dv-mark' });
      nB.setAttribute('stroke', '#c9cbd6'); nB.setAttribute('stroke-dasharray', '3 3');
      tex(B[0] + 62, B[1], '\\bar{b} = \\mathbf{0}', { color: '#9aa1b9', fs: 13, cls: 'dv-mark' });
    }, 0);
    /* 2. 两路余切在 split 处拼接成算子完整 VJP 的输入 */
    T(() => {
      eSA.setAttribute('stroke', GREEN); eSA.setAttribute('stroke-width', 2.2);
      eSB.setAttribute('stroke', '#9aa1b9'); eSB.setAttribute('stroke-width', 1.6); eSB.setAttribute('stroke-dasharray', '4 4');
      nS.setAttribute('stroke', GREEN); nS.setAttribute('stroke-width', 2.5);
      tex(S[0], S[1] - 60, 'c = (\\bar{a},\\; \\mathbf{0})', { color: GREEN, fs: 14.5, weight: 600, cls: 'dv-mark' });
    }, 1);
    /* 3. 拼接后的余切喂给 VJP, 得到输入侧余切 */
    T(() => {
      eVS.setAttribute('stroke', GREEN); eVS.setAttribute('stroke-width', 2.2);
      nV.setAttribute('stroke', GREEN); nV.setAttribute('stroke-width', 2.5); nV.setAttribute('fill', 'rgba(26,127,55,.14)');
      tex(V[0] + 10, V[1] + 56, '\\bar{v} = \\mathrm{VJP}_{\\mathrm{split}}\\bigl(v,\\, c\\bigr)', { color: GREEN, fs: 13.5, weight: 600, cls: 'dv-mark' });
    }, 2);
  };
  base();
});
</script>
</body>
</html>
