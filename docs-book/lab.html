<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-lab — 计算图动效</title>
<style>
:root { --accent: #3a4aa8; --dim: #6b7280; --border: rgba(58,74,168,.16); --panel: #edf0f8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"PingFang SC",sans-serif; color: #1f2937; background: #fff; line-height: 1.8; }
.wrap { max-width: 980px; margin: 0 auto; padding: 40px 28px 60px; }
h1 { font: 500 40px Caveat,"Xingkai SC","Kaiti SC",KaiTi,cursive; color: var(--accent); margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 14.5px; margin-bottom: 36px; }
.frame { border: 1px solid var(--border); border-radius: 12px; background:
  radial-gradient(circle at 1px 1px, #efede7 1px, transparent 0) 0 0/26px 26px; padding: 22px 8px; }
.frame svg { display: block; margin: 0 auto; max-width: 100%; }
.legend { display: flex; gap: 26px; justify-content: center; margin-top: 14px; font: 500 17px Caveat,cursive; }
.legend span { display: inline-flex; align-items: center; gap: 7px; color: #6b7280; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
code { font: 12px ui-monospace,Menlo,monospace; color: var(--accent); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
<h1>hero-lab</h1>
<div class="sub">一张计算图的完整动效 —— 前向建图与反向回传按拓扑序逐拍传播, 循环一个训练步</div>

<div class="frame"><svg id="cg" viewBox="0 0 640 210" width="640" height="210"></svg></div>

<h2 style="font:500 26px Caveat,'Xingkai SC','Kaiti SC',KaiTi,cursive;margin:34px 0 2px">2. 画 · 梯度流淌的山谷</h2>
<p style="font-size:13.5px;color:#6b7280;margin:0 0 12px">同一门原语, 从图示到绘画 —— 三重山、落日、飞鸟, 梯度沿谷底流淌</p>
<div class="frame"><svg id="painting" viewBox="0 0 640 340" width="640" height="340"></svg></div>
<div class="legend">
  <span><i style="background:#bf8700"></i>forward · 值图生长</span>
  <span><i style="background:#1a7f37"></i>backward · 梯度图生长</span>
</div>
<p style="text-align:center;color:#9aa1b9;font-size:12.5px;margin-top:6px">
  叶子 W1 b1 W2 b2 y 在下方; 反向脉冲到达参数叶即一次 <code>grads</code> 汇聚, 周期 11s
</p>
</div>

<script src="book/resources/js/sketch.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const s = Sketch(document.getElementById('cg'));

  /* ---- 结构: 节点 ---- */
  const ops = [ /* [id, x, 名称] 主链 */
    ['mm1', 105, 'matmul'], ['z1', 196, 'add'], ['h', 287, 'relu'],
    ['mm2', 378, 'matmul'], ['o', 469, 'add'], ['sm', 545, 'softmax'], ['L', 618, 'CE'],
  ];
  const leaves = [ /* [id, x, 名称] 参数与标签 (下方一行) */
    ['W1', 105, 'W1'], ['b1', 196, 'b1'],
    ['W2', 378, 'W2'], ['b2', 469, 'b2'], ['y', 618, 'y'],
  ];
  const Y_OP = 40, Y_LEAF = 152, R_OP = 11, R_LEAF = 7;

  function labelM(x, y, text, color) {           /* 节点名是代码对象: 等宽体 */
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', color);
    t.setAttribute('style', 'font: 600 11px ui-monospace, Menlo, monospace');
    t.textContent = text; s.svg.appendChild(t); return t;
  }
  ops.forEach(([id, x, name]) => { s.node(x, Y_OP, { r: R_OP }); labelM(x, Y_OP + R_OP + 14, name, '#6b7280'); });
  /* 语义配色: 参数 = 反向脉冲的汇聚终点, 实心靛蓝; y 不参与回传, 灰化 */
  const leafStyle = { W1: '#3a4aa8', b1: '#3a4aa8', W2: '#3a4aa8', b2: '#3a4aa8', y: '#9aa1b9' };
  leaves.forEach(([id, x, name]) => { s.node(x, Y_LEAF, { r: R_LEAF, fill: leafStyle[id], stroke: 'none' }); labelM(x, Y_LEAF + 16, name, leafStyle[id]); });
  s.node(14, Y_OP, { r: 7 }); labelM(14, Y_OP - 12, 'x', '#3a4aa8');   /* x: 数据输入, 主链起点 */

  /* ---- 结构: 边 (水平主链 / 垂直参数) ---- */
  const H = (a, b) => `M${a + R_OP} ${Y_OP} C ${a + 40} ${Y_OP}, ${b - 40} ${Y_OP}, ${b - R_OP - 2} ${Y_OP}`;
  const V = (x) => `M${x} ${Y_LEAF - R_LEAF} C ${x + 3} ${Y_LEAF - 30}, ${x - 3} ${Y_OP + R_OP + 26}, ${x} ${Y_OP + R_OP + 3}`;
  const EDGE = {
    'x-mm1':  `M${14 + R_LEAF} ${Y_OP} C 46 ${Y_OP}, 64 ${Y_OP}, ${105 - R_OP - 2} ${Y_OP}`,
    'W1-mm1': V(105), 'mm1-z1': H(105, 196), 'b1-z1': V(196), 'z1-h': H(196, 287),
    'h-mm2':  H(287, 378), 'W2-mm2': V(378), 'mm2-o': H(378, 469), 'b2-o': V(469),
    'o-sm':   H(469, 545), 'sm-L': H(545, 618),
    'y-L':    V(618),
  };
  for (const k in EDGE) s.path(EDGE[k], { stroke: 'rgba(58,74,168,.30)', width: 1.3 });

  /* ---- 编排: 一个训练步 (period 11s) ---- */
  const F = '#bf8700', B = '#1a7f37';
  /* 前向: 拓扑序逐拍 (每拍 0.8s) */
  s.pulse(EDGE['x-mm1'],  { t0: 0.3, color: F });  s.pulse(EDGE['W1-mm1'], { t0: 0.3, color: F });
  s.pulse(EDGE['mm1-z1'], { t0: 1.1, color: F });  s.pulse(EDGE['b1-z1'],  { t0: 1.1, color: F });
  s.pulse(EDGE['z1-h'],   { t0: 1.9, color: F });
  s.pulse(EDGE['h-mm2'],  { t0: 2.7, color: F });  s.pulse(EDGE['W2-mm2'], { t0: 2.7, color: F });
  s.pulse(EDGE['mm2-o'],  { t0: 3.5, color: F });  s.pulse(EDGE['b2-o'],   { t0: 3.5, color: F });
  s.pulse(EDGE['o-sm'],   { t0: 4.3, color: F });
  s.pulse(EDGE['sm-L'],   { t0: 5.1, color: F });  s.pulse(EDGE['y-L'],    { t0: 5.1, color: F });
  /* 反向: 逆拓扑序 (梯度到达参数叶 = grads 汇聚) */
  s.pulse(EDGE['sm-L'],   { t0: 6.2, color: B });
  s.pulse(EDGE['o-sm'],   { t0: 7.0, color: B });
  s.pulse(EDGE['mm2-o'],  { t0: 7.8, color: B });  s.pulse(EDGE['b2-o'],   { t0: 7.8, color: B });
  s.pulse(EDGE['h-mm2'],  { t0: 8.6, color: B });  s.pulse(EDGE['W2-mm2'], { t0: 8.4, color: B });
  s.pulse(EDGE['z1-h'],   { t0: 9.4, color: B });
  s.pulse(EDGE['mm1-z1'], { t0: 10.2, color: B }); s.pulse(EDGE['b1-z1'],  { t0: 10.0, color: B });
  s.pulse(EDGE['x-mm1'],  { t0: 11.0, color: B, travel: 0.5 }); s.pulse(EDGE['W1-mm1'], { t0: 10.8, color: B, travel: 0.5 });
})();
/* ---- 2. 画: 梯度流淌的山谷 ---- */
(function () {
  const s = Sketch(document.getElementById('painting'));
})();

(function () {
  const s = Sketch(document.getElementById('painting'));
  const P = s.PALETTE;

  /* 远山 (淡) 中山 (中) 近山 (浓) —— 三层 rough 波浪 */
  s.path('M-10 150 C 80 70, 150 120, 230 100 C 310 80, 380 130, 470 105 C 540 88, 600 120, 650 95 L 650 200 L -10 200 Z',
         { stroke: 'rgba(58,74,168,.30)', width: 1.4 });
  s.path('M-10 190 C 70 130, 160 175, 250 155 C 330 138, 420 185, 520 160 C 570 148, 610 170, 650 158 L 650 240 L -10 240 Z',
         { stroke: 'rgba(58,74,168,.50)', width: 1.6, fill: 'rgba(58,74,168,.05)' });
  s.path('M-10 240 C 90 195, 180 235, 290 218 C 380 204, 470 245, 560 225 C 600 216, 625 230, 650 222 L 650 300 L -10 300 Z',
         { stroke: 'rgba(58,74,168,.75)', width: 1.9 });

  /* 落日: 光晕 + 日轮 (node 空心 + dot 实心) */
  s.node(500, 92, { r: 34, fill: 'rgba(191,135,0,.10)', stroke: 'rgba(191,135,0,.35)' });
  s.dot(500, 92, P.amber, 20);

  /* 飞鸟: 两笔 M 形 */
  s.path('M180 80 q 8 -9 16 0 q 8 -9 16 0', { stroke: 'rgba(44,58,140,.85)', width: 1.8 });
  s.path('M225 65 q 6 -7 12 0 q 6 -7 12 0', { stroke: 'rgba(44,58,140,.7)', width: 1.6 });

  /* 谷底: 一条 S 形溪流, 梯度光点沿它流淌 */
  const river = 'M80 330 C 180 300, 200 268, 320 262 C 420 257, 460 230, 560 208';
  s.path(river, { stroke: 'rgba(58,74,168,.45)', width: 2.2 });
  s.flow(river, { color: P.amber, dur: 6.5, size: 4.5 });

  /* 手写落款 */
  s.label(88, 318, '∇ flows downhill', { size: 22, color: 'rgba(58,74,168,.75)' });
  s.label(600, 325, 'tinyautograd', { size: 19, color: '#9aa1b9' });
})();
</script>
</body>
</html>
