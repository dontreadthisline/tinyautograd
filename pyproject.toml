[project]
name = "tinyautograd"
version = "0.1.0"
description = "A minimal functional autograd framework on top of MLX single-op forward + vjp"
requires-python = ">=3.14"
dependencies = [
    "mlx>=0.32",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyautograd"]

[tool.pyright]
include = ["tinyautograd", "tests", "examples"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
